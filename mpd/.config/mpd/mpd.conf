music_directory    "/run/media/madhatter/SDCard/music"
db_file            "~/.config/mpd/database"
state_file         "~/.config/mpd/state"
sticker_file       "~/.config/mpd/sticker.sql"
playlist_directory    "~/.config/mpd/playlists"

bind_to_address    "127.0.0.1"
port               "6600"

audio_output {
    type    "pipewire"
    name    "PipeWire"
}

audio_output {
    type    "fifo"
    name    "Visualizer"
    path    "/tmp/mpd.fifo"
    format  "44100:16:2"
}
