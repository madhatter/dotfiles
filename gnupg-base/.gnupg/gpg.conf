#-----------------------------
# default key
#-----------------------------
# The default key to sign with. If this option is not used, the default key is
# the first key found in the secret keyring
default-key 0x8D7AEBBD572C77491AE9844A7FE2462412942E7E

#-----------------------------
# crypto preferences
#-----------------------------
# Preferred algorithms for new keys (recommended modern defaults)
personal-cipher-preferences AES256
personal-digest-preferences SHA512
personal-compress-preferences ZLIB

#-----------------------------
# behavior
#-----------------------------
# Disable inclusion of the version string in ASCII armored output
no-emit-version

# Disable comment string in clear text signatures and ASCII armored messages
no-comments

# Display long key IDs (short IDs are insecure)
keyid-format 0xlong

# List all keys (or the specified ones) along with their fingerprints
with-fingerprint

# Display the calculated validity of user IDs during key listings
list-options show-uid-validity
verify-options show-uid-validity

#-----------------------------
# keyserver
#-----------------------------
# Modern keyserver with HTTPS encryption
# This is the server that --recv-keys, --send-keys, and --search-keys will
# communicate with to receive keys from, send keys to, and search for keys on
keyserver hkps://keys.openpgp.org
# Alternative keyserver: hkps://keyserver.ubuntu.com
# To send to multiple servers, use:
#   gpg --keyserver hkps://keys.openpgp.org --send-keys KEY_ID
#   gpg --keyserver hkps://keyserver.ubuntu.com --send-keys KEY_ID
keyserver-options auto-key-retrieve
