# ~/.config/pipewire/pipewire.conf.d/50-monitor-hpf.conf

# Creates a virtual sink with a high-pass filter.
# Prevents small monitor speakers from clipping on sub-bass frequencies.

context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Monitor High-Pass Filter"
            media.name       = "Monitor HPF"
            filter.graph = {
                nodes = [
                    {
                        type    = builtin
                        name    = hpf_node
                        label   = bq_highpass
                        # Cut off frequencies below 120Hz.
                        # Q-factor of 0.707 provides a flat response before the cutoff.
                        #control = { "Freq" = 120.0, "Q" = 0.707 }
                        control = { "Freq" = 95.0, "Q" = 1.3 }
                    }
                ]
            }
            capture.props = {
                node.name   = "effect_input.monitor_hpf"
                media.class = Audio/Sink
                # Explicitly define stereo input to prevent mono fallback
                audio.channels = 2
                audio.position = [ FL FR ]
            }
            playback.props = {
                node.name   = "effect_output.monitor_hpf"
                # Target sink directly extracted from wpctl default configured devices
                node.target = "alsa_output.pci-0000_0b_00.1.hdmi-stereo-extra1"
                # Explicitly map output to Left and Right hardware channels
                audio.channels = 2
                audio.position = [ FL FR ]
            }
        }
    }
]
