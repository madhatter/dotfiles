# picom v13 config

backend = "egl";
vsync = true;
xrender-sync-fence = true;

shadow = true;
shadow-radius = 12;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-opacity = 0.6;

fading = true;
fade-delta = 5;
fade-in-step = 0.02;
fade-out-step = 0.03;

blur:
{
  method = "dual_kawase";
  size = 2;
  deviation = 0.5;
  strength = 0.5;
};

corner-radius = 10;

detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;
use-ewmh-active-win = true;

rules: (
  # General opacity + dim for inactive windows (not dock/bar)
  { match = "focused && window_type != 'dock'";  opacity = 1.0; },
  { match = "!focused && window_type != 'dock'"; opacity = 0.9; dim = 0.1; },
 
  # Workaround for slock
  { match = "fullscreen"; opacity = 1.0; corner-radius = 0; round-borders = 0; shadow = false; },

  # Terminals
  { match = "class_g = 'com.mitchellh.ghostty' && focused";    opacity = 0.95; blur-background = true; },
  { match = "class_g = 'com.mitchellh.ghostty' && !focused";   opacity = 0.80; blur-background = true; },
  { match = "class_g = 'Alacritty' && focused";  opacity = 0.95; },
  { match = "class_g = 'Alacritty' && !focused"; opacity = 0.80; },
  { match = "class_g = 'St' && focused";    opacity = 0.95; },
  { match = "class_g = 'St' && !focused";   opacity = 0.80; },
  { match = "class_g = 'URxvt' && focused";  opacity = 0.95; },
  { match = "class_g = 'URxvt' && !focused"; opacity = 0.80; },

  { match = "class_g = 'slock'"; opacity = 1.0; },

  # Shadow excludes
  { match = "name = 'Notification'";          shadow = false; },
  { match = "name *= 'picom'";                shadow = false; },
  { match = "name *= 'Chromium'";             shadow = false; },
  { match = "name *= 'Chrome'";               shadow = false; },
  { match = "class_g ?= 'Notify-osd'";        shadow = false; },
  { match = "_GTK_FRAME_EXTENTS@";            shadow = false; },
  { match = "_NET_WM_STATE@[*] *= 'hidden'";  shadow = false; },

  # dwm bar: always treat as focused (was focus-exclude)
  { match = "x = 0 && y = 0 && override_redirect = true"; focus = true; corner-radius = 0; round-borders = 0; shadow = false; },

  # Window types
  { match = "window_type = 'tooltip'";       fade = true; shadow = false; opacity = 0.85; focus = true; },
  { match = "window_type = 'dock'";          shadow = false; clip-shadow-above = true; blur-background = false; },
  { match = "window_type = 'popup_menu'";    opacity = 0.95; },
  { match = "window_type = 'dropdown_menu'"; opacity = 0.95; },

  # dunst: handles its own corner rounding and transparency
  { match = "class_g = 'dunst'"; corner-radius = 0; shadow = false; blur-background = false; },
);
